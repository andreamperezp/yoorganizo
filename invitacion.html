<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu invitación · Yo Organizo</title>
<meta name="description" content="Tenés una invitación. Abrila para confirmar si venís.">
<meta property="og:title" content="Tenés una invitación 💌">
<meta property="og:description" content="Abrila para ver los detalles y confirmar si venís.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Invitación online genérica: tarjeta centrada; los colores llegan con la invitación (según el evento). */
:root {
  color-scheme: light;
  --bg: #F6F4FB; --card: #FFFFFF; --ink: #2A2F3A; --muted: #6B7180; --line: #ECE7F2;
  --accent: #B3A6F0; --accent-soft: #ECE8FC; --accent-text: #6650C9; --accent-ink: #261C57;
  --ok: #2E8B57; --warn: #C2562A;
  --font-display: "Fredoka", "Avenir Next Rounded", "Segoe UI", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
body { background: radial-gradient(circle at 50% 0%, var(--accent-soft), var(--bg) 60%); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.wrap { max-width: 520px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.card { position: relative; background: var(--card); border-radius: 32px; padding: 34px 26px 30px; box-shadow: 0 30px 60px -36px var(--accent-text); border: 1px solid var(--line); text-align: center; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 10px; border: 1.5px dashed var(--accent); border-radius: 24px; opacity: .55; pointer-events: none; }
.para { font-family: var(--font-display); font-weight: 500; font-size: 20px; color: var(--accent-text); margin: 0 0 6px; text-wrap: balance; }
.eyebrow { text-transform: uppercase; letter-spacing: .2em; font-size: 12px; font-weight: 700; color: var(--muted); margin: 14px 0 4px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(32px, 9vw, 44px); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 .name { color: var(--accent-text); }
.sub { color: var(--muted); margin: 8px 0 0; }
.msg { margin: 20px auto 0; max-width: 400px; background: var(--accent-soft); border-radius: 18px; padding: 14px 18px; font-style: italic; color: var(--accent-ink); }
.details { margin: 22px 0 0; display: grid; gap: 0; text-align: left; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.row .ico { width: 40px; height: 40px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; }
.row svg { width: 20px; height: 20px; }
.row b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.row span { color: var(--muted); font-size: 14px; }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 16px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--accent); color: var(--accent-text); background: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14px; text-decoration: none; }
.ask { margin: 26px 0 0; }
.ask p { margin: 0 0 12px; color: var(--muted); }
.btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; }
.btn { border: 0; border-radius: 999px; padding: 14px 24px; font-family: var(--font-display); font-weight: 600; font-size: 18px; min-width: 150px; }
.btn.yes { background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 20px -12px var(--accent-text); }
.btn.no { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
.btn:focus-visible, .step:focus-visible, .pill:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }
.answer h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; margin: 0 0 4px; }
.extra { margin: 14px auto 0; max-width: 360px; display: grid; gap: 12px; background: #FBFAFE; border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.stepper { display: flex; align-items: center; justify-content: center; gap: 16px; }
.step { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid var(--accent); background: #fff; color: var(--accent-text); font-size: 24px; line-height: 1; }
.count { font-family: var(--font-display); font-weight: 700; font-size: 32px; min-width: 40px; }
input[type=text] { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font: inherit; color: var(--ink); background: #fff; }
.save { background: var(--accent-text); color: #fff; border: 0; border-radius: 999px; padding: 12px 20px; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.ok { color: var(--ok); font-weight: 700; }
.err { color: var(--warn); font-weight: 600; }
.change { background: none; border: 0; color: var(--muted); text-decoration: underline; margin-top: 12px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
.foot a { color: inherit; }
.center { text-align: center; padding: 60px 10px; color: var(--muted); }
.float { position: fixed; pointer-events: none; color: var(--accent); opacity: .5; animation: drift 9s ease-in-out infinite; z-index: 0; }
.wrap { position: relative; z-index: 1; }
@keyframes drift { 50% { transform: translateY(-14px) rotate(6deg); } }
@media (prefers-reduced-motion: reduce) { .float { animation: none; } }
</style>
</head>
<body>
<span class="float" style="left:6%;top:12%;font-size:28px">★</span>
<span class="float" style="right:8%;top:30%;font-size:22px;animation-delay:-3s">♥</span>
<span class="float" style="left:10%;bottom:14%;font-size:20px;animation-delay:-5s">★</span>
<main class="wrap" id="app"><p class="center">Abriendo tu invitación…</p></main>
<script>
(function () {
  "use strict";
  var URL = "https://kxcjvqskrsjefmqfbhpa.supabase.co";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4Y2p2cXNrcnNqZWZtcWZiaHBhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MjI2MDEsImV4cCI6MjEwODA5ODYwMX0.4JJpwNF2pwqecmMsM2QgF9qsHJlruwYyy-JRhpzpmyI";
  var app = document.getElementById("app");
  var token = new URLSearchParams(location.search).get("t") || "";
  var sb = window.supabase ? window.supabase.createClient(URL, KEY, { auth: { persistSession: false } }) : null;
  var inv = null, rsvp = "pend", total = 1, note = "", saved = false, err = "";

  var ICONS = {
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
    shirt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 6.6 16 4l-1.5 2a3 3 0 0 1-5 0L8 4 3.6 6.6 5 11l2-.7V20h10v-9.7l2 .7z"/></svg>'
  };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function countNames(para) { var n = String(para || "").split(/,|\s+y\s+|&/).map(function (x) { return x.trim(); }).filter(Boolean).length; return Math.max(1, n); }
  function plural() { return countNames(inv.para + (inv.nene ? ", " + inv.nene : "")) > 1; }

  function applyColors(e) {
    var p = (e && e.pal) || null; if (!p) return;
    var r = document.documentElement.style;
    if (p.accent) r.setProperty("--accent", p.accent);
    if (p.soft) r.setProperty("--accent-soft", p.soft);
    if (p.text) r.setProperty("--accent-text", p.text);
    if (p.ink) r.setProperty("--accent-ink", p.ink);
    if (p.bg) r.setProperty("--bg", p.bg);
  }

  function render() {
    if (!inv) return;
    var e = inv.event || {}, pl = plural();
    var who = inv.para + (inv.nene ? " y " + inv.nene : "");
    var titleHTML = esc(e.titulo || "Te invitamos").replace(esc(e.nombre || "\u0000"), '<span class="name">' + esc(e.nombre || "") + "</span>");
    var mapLink = e.direccion ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(e.direccion) : "";
    var html = '<article class="card">' +
      '<p class="para">Para ' + esc(who) + "</p>" +
      '<p class="eyebrow">' + (e.kind === "cumple" ? "Te invitamos a festejar" : "Te invitamos al") + "</p>" +
      "<h1>" + titleHTML + "</h1>" +
      (e.sub ? '<p class="sub">' + esc(e.sub) + "</p>" : "") +
      (inv.mensaje ? '<p class="msg">“' + esc(inv.mensaje) + "”</p>" : "") +
      '<div class="details">' +
        (e.fecha ? '<div class="row"><span class="ico">' + ICONS.cal + "</span><div><b>" + esc(e.fecha) + "</b></div></div>" : "") +
        (e.hora ? '<div class="row"><span class="ico">' + ICONS.clock + "</span><div><b>" + esc(e.hora) + (e.fin ? " a " + esc(e.fin) : "") + " h</b>" + (e.horaNota ? "<span>" + esc(e.horaNota) + "</span>" : "") + "</div></div>" : "") +
        (e.lugar || e.direccion ? '<div class="row"><span class="ico">' + ICONS.pin + "</span><div><b>" + esc(e.lugar || e.direccion) + "</b>" + (e.lugar && e.direccion ? "<span>" + esc(e.direccion) + "</span>" : "") + "</div></div>" : "") +
        (e.vestimenta ? '<div class="row"><span class="ico">' + ICONS.shirt + "</span><div><b>" + esc(e.vestimenta) + "</b></div></div>" : "") +
        (e.regalos ? '<div class="row"><span class="ico">' + ICONS.gift + "</span><div><b>Regalos</b><span>" + esc(e.regalos) + "</span></div></div>" : "") +
      "</div>" +
      '<div class="links">' +
        (mapLink ? '<a class="pill" href="' + mapLink + '" target="_blank" rel="noopener">Cómo llegar</a>' : "") +
        (/^https?:\/\//.test(e.regalos || "") ? '<a class="pill" href="' + esc(e.regalos) + '" target="_blank" rel="noopener">Ver lista de regalos</a>' : "") +
      "</div>" +
      '<section class="ask" aria-live="polite">' + askHTML(pl, e) + "</section>" +
      "</article>" +
      '<p class="foot">Hecho con <a href="https://yoorganizo.vercel.app" target="_blank" rel="noopener">Yo Organizo</a></p>';
    app.innerHTML = html;
  }

  function askHTML(pl, e) {
    if (rsvp === "pend") {
      return "<p>" + (e.confirmar ? "Contanos si " + (pl ? "vienen" : "venís") + " antes del " + esc(e.confirmar) + "." : "Contanos si " + (pl ? "vienen" : "venís") + ".") + "</p>" +
        '<div class="btns"><button class="btn yes" data-act="si">' + (pl ? "Sí, vamos" : "Sí, voy") + '</button><button class="btn no" data-act="no">' + (pl ? "No podemos ir" : "No puedo ir") + "</button></div>" +
        (err ? '<p class="err">' + esc(err) + "</p>" : "");
    }
    if (rsvp === "no") {
      return '<div class="answer"><h2>Gracias por avisarnos</h2><p>Te vamos a extrañar.</p>' + (err ? '<p class="err">' + esc(err) + "</p>" : "") + '<button class="change" data-act="reset">Cambiar mi respuesta</button></div>';
    }
    return '<div class="answer"><h2>¡Te esperamos!</h2>' +
      '<div class="extra"><span>¿Cuántos van en total?</span>' +
      '<div class="stepper"><button class="step" data-act="minus" aria-label="Uno menos">−</button><span class="count" aria-live="polite">' + total + '</span><button class="step" data-act="plus" aria-label="Uno más">+</button></div>' +
      '<input type="text" id="note" maxlength="300" placeholder="¿Algo que tengamos que saber? Alergias, horario…" value="' + esc(note) + '">' +
      '<button class="save" data-act="save">Guardar</button>' +
      (saved ? '<span class="ok">¡Listo, lo anotamos!</span>' : "") + (err ? '<span class="err">' + esc(err) + "</span>" : "") +
      "</div>" +
      '<button class="change" data-act="reset">Cambiar mi respuesta</button></div>';
  }

  function send(r, showSaved) {
    err = "";
    var n = document.getElementById("note"); if (n) note = n.value;
    if (!sb) { err = "No pudimos conectarnos. Probá de nuevo en un rato."; render(); return; }
    sb.rpc("respond_invite", { p_token: token, p_rsvp: r, p_plus: r === "si" ? Math.max(0, total - 1) : 0, p_note: r === "si" ? note : "" })
      .then(function (x) { if (x.error || x.data !== true) throw new Error("no"); saved = !!showSaved; render(); })
      .catch(function () { err = "No pudimos guardar tu respuesta. Revisá tu conexión y probá de nuevo."; render(); });
  }

  app.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-act]"); if (!b) return;
    var a = b.dataset.act;
    if (a === "si") { rsvp = "si"; saved = false; render(); send("si"); }
    else if (a === "no") { rsvp = "no"; render(); send("no"); }
    else if (a === "reset") { rsvp = "pend"; saved = false; err = ""; render(); }
    else if (a === "minus" || a === "plus") { var n = document.getElementById("note"); if (n) note = n.value; total = Math.max(1, Math.min(21, total + (a === "plus" ? 1 : -1))); saved = false; render(); }
    else if (a === "save") { send("si", true); }
  });

  if (!token || !sb) { app.innerHTML = '<p class="center">Este link de invitación no es válido. Pedile a quien te invitó que te lo mande de nuevo.</p>'; return; }
  sb.rpc("get_invite", { p_token: token }).then(function (r) {
    if (r.error || !r.data) { app.innerHTML = '<p class="center">No encontramos esta invitación. Pedile a quien te invitó que te mande el link de nuevo.</p>'; return; }
    inv = r.data;
    applyColors(inv.event);
    if (inv.event && inv.event.titulo) document.title = inv.event.titulo + " · Invitación";
    rsvp = inv.rsvp || "pend";
    note = inv.note || "";
    total = rsvp === "si" ? (Number(inv.plus) || 0) + 1 : countNames(inv.para + (inv.nene ? ", " + inv.nene : ""));
    render();
  }).catch(function () { app.innerHTML = '<p class="center">No pudimos abrir la invitación. Revisá tu conexión y probá de nuevo.</p>'; });
})();
</script>
</body>
</html>
