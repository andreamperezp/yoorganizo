<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Yo Organizo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&family=EB+Garamond:ital@1&display=swap">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout: una columna de app; resumen arriba, pestañas, contenido. Ruta = fases en orden cronológico.
   La paleta cambia según data-baby en <html>: nene (celeste), nena (rosa), sorpresa (menta y amarillo).
   Diseño siempre claro y pastel, también en equipos con modo oscuro. */
:root {
  color-scheme: light;
  --bg: #F6F7F4;
  --surface: #FFFFFF;
  --ink: #2A2F3A;
  --muted: #6B7180;
  --line: #E3E5EA;
  --accent: #6C6FB8;
  --accent-ink: #FFFFFF;
  --accent-soft: #ECECF8;
  --accent-text: #6C6FB8;
  --blush: #FCE8D6;
  --blush-ink: #8A4E22;
  --warn: #C2562A;
  --ok: #2E8B57;
  --deco: #B9BBE6;
  --font-display: "Fredoka", "Avenir Next Rounded", "Segoe UI", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}

/* Paletas del bebé */
:root[data-baby="nene"] { --bg: #EEF8FE; --line: #D3ECFA; --accent: #86CCF2; --accent-ink: #0F3A5A; --accent-soft: #DCF1FC; --accent-text: #2B8AC6; --blush: #FFF4CF; --blush-ink: #7A5A00; --deco: #BCE3F8; --ink: #22384D; --muted: #5C7389; }
:root[data-baby="nena"] { --bg: #FFF5F8; --line: #F6E1E8; --accent: #F5AFC6; --accent-ink: #5A1E35; --accent-soft: #FDE7EF; --accent-text: #C2557F; --blush: #FFEADF; --blush-ink: #8A4128; --deco: #F9CCDB; --ink: #3A2830; --muted: #846A74; }
:root[data-baby="sorpresa"] { --bg: #F3FBF7; --line: #D9EEE4; --accent: #96DCC5; --accent-ink: #134236; --accent-soft: #E0F5EC; --accent-text: #2E8A70; --blush: #FFF2C4; --blush-ink: #7A5A00; --deco: #C2EADA; --ink: #23352F; --muted: #61776F; }
/* Paletas del cumple: infantil (amarillo, turquesa y coral), adulto (lavanda y dorado), 15 (rosa lila y plata) */
:root[data-baby="infantil"] { --bg: #FFF9EE; --line: #F5E6C8; --accent: #FFC46B; --accent-ink: #4A2E00; --accent-soft: #FFF0D4; --accent-text: #B76400; --blush: #DDF5F1; --blush-ink: #1E6B62; --deco: #FFD99E; --ink: #3A2E1E; --muted: #7D6B55; }
:root[data-baby="adulto"] { --bg: #F7F5FE; --line: #E4DFF7; --accent: #B3A6F0; --accent-ink: #261C57; --accent-soft: #ECE8FC; --accent-text: #6650C9; --blush: #FFF2CC; --blush-ink: #7A5A00; --deco: #D5CCF7; --ink: #2A2640; --muted: #6F6A88; }
:root[data-baby="quince"] { --bg: #FDF5FB; --line: #F2DDEC; --accent: #E8AEDB; --accent-ink: #4E1844; --accent-soft: #FAE6F5; --accent-text: #AD4699; --blush: #EEE9FA; --blush-ink: #57409A; --deco: #F3CDEA; --ink: #3A2438; --muted: #86697F; }
body { transition: background-color .6s ease, color .6s ease; }

/* Iconos */
.ic { width: 1.15em; height: 1.15em; stroke-width: 1.9; vertical-align: -0.2em; flex: none; }
svg.lucide { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
.icon-bubble { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font-size: 20px; }

/* Fondo decorativo que flota */
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; color: var(--deco); }
.sky span { position: absolute; display: block; animation: drift 14s ease-in-out infinite; opacity: .55; }
.sky span svg { width: 100%; height: 100%; }
@keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(12px, -18px) rotate(6deg); } }
.wrap { position: relative; z-index: 1; }

/* Selector nene / nena / sorpresa */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(255, 255, 255, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: fade .25s ease; }
.modal-card { position: relative; background: linear-gradient(160deg, #FFFFFF 0%, #FFF8FB 45%, #F2F9FF 100%); color: #2A2F3A; border: 1px solid #EEE7F2; box-shadow: 0 30px 60px -30px rgba(120, 110, 170, .45); border-radius: 32px; padding: 34px 24px 26px; max-width: 640px; width: 100%; text-align: center; display: grid; gap: 18px; animation: pop .35s cubic-bezier(.2,1.4,.4,1); max-height: 90vh; overflow: auto; }
.modal-card .muted, .modal-card .eyebrow { color: #6B7180; }
.modal-card .pick-name input { background: #FFFFFF; border-color: #E6DDEC; color: #2A2F3A; }
.modal-card .btn.ghost { color: #6B7180; border-color: #E6DDEC; }
.modal-hero { display: flex; justify-content: center; gap: 10px; color: #F5AFC6; font-size: 26px; }
.modal-hero span:nth-child(2) { color: #86CCF2; font-size: 34px; animation: bob 3s ease-in-out infinite; }
.modal-hero span:nth-child(3) { color: #96DCC5; }
.modal-card h2 { font-size: 26px; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.choice { border: 2px solid transparent; border-radius: 22px; padding: 18px 10px; display: grid; gap: 8px; justify-items: center; font-family: var(--font-display); font-weight: 600; font-size: 17px; transition: transform .2s ease, border-color .2s; }
.choice:hover { transform: translateY(-4px); box-shadow: 0 14px 24px -16px currentColor; }
.choice .ico { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: #FFFFFF; animation: bob 3s ease-in-out infinite; }
.choice small { font-family: var(--font-body); font-weight: 400; font-size: 13px; opacity: .8; }
.choice.nene { background: #DCF1FC; color: #2B8AC6; }
.choice.nena { background: #FDE7EF; color: #B04872; }
.choice.sorpresa { background: #E0F5EC; color: #2A7D66; }
.choice.sel { border-color: currentColor; }
.choice.infantil { background: #FFF0D4; color: #B76400; }
.choice.adulto { background: #ECE8FC; color: #5B46BE; }
.choice.quince { background: #FAE6F5; color: #A23F8E; }
.moment { display: inline-flex; gap: 8px; background: #F4F1F8; border-radius: 999px; padding: 4px; }
.moment-opt { position: relative; }
.moment-opt input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.moment-opt span { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #6B7180; }
.moment-opt input:checked + span { background: #fff; color: #2A2F3A; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
.moment-opt input[value="tarde"]:checked + span svg { color: #E9A23B; }
.moment-opt input[value="noche"]:checked + span svg { color: #6650C9; }
.moment-opt input:focus-visible + span { outline: 2px solid #6650C9; }
.head-tags { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.head-tags span { display: inline-flex; align-items: center; gap: 6px; }
.pick-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%; }
.pick-row .pick-name { flex: 1 1 200px; max-width: 260px; }
.pick-row .pick-age { flex: 0 1 140px; }
.onb-check { grid-column: 1 / -1; display: flex; align-items: flex-start; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; font-size: 14px; }
.onb-check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent-text); }
.onb-check small { color: var(--muted); }
.tpl-saved { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--accent-text); background: var(--accent-soft); border-radius: 999px; padding: 4px 10px; justify-self: start; }
.choice .ico { color: inherit; }
.choice:nth-child(2) .ico { animation-delay: .4s; }
.choice:nth-child(3) .ico { animation-delay: .8s; }
.swatches { display: flex; gap: 4px; }
.swatches i { width: 14px; height: 14px; border-radius: 50%; display: block; }
@media (max-width: 520px) { .choices { grid-template-columns: 1fr; } .choice { grid-template-columns: auto 1fr auto; text-align: left; justify-items: start; align-items: center; } .choice .ico { width: 48px; height: 48px; font-size: 22px; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* Globos que suben al elegir, corazones al tildar */
.float-up { position: fixed; bottom: -80px; z-index: 60; pointer-events: none; animation: rise 2.6s cubic-bezier(.3,.6,.4,1) forwards; }
.float-up svg { width: 100%; height: 100%; }
@keyframes rise { to { transform: translate(var(--dx, 0), -115vh) rotate(var(--rot, 0deg)); opacity: .2; } }
.spark { position: fixed; z-index: 60; pointer-events: none; width: 14px; height: 14px; color: var(--accent-text); animation: burst .8s ease-out forwards; }
.spark svg { width: 100%; height: 100%; display: block; }
@keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.4); opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; display: flex; gap: 8px; align-items: center; animation: toast 2.8s ease forwards; max-width: calc(100% - 32px); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px); } 12%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 10px); } }
.baby-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent-text); border: 0; border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 13px; }
.baby-name { color: var(--accent-text); }
.online { background: var(--surface); border: 2px solid var(--accent); border-radius: 26px; padding: 20px; display: grid; gap: 14px; box-shadow: 0 18px 40px -30px var(--accent-text); }
.online-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.online-head > div { flex: 1 1 320px; display: grid; gap: 4px; }
.online-head .btn { display: inline-flex; align-items: center; gap: 6px; }
.online textarea { min-height: 70px; }
.g-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.g-head > div { flex: 1 1 320px; display: grid; gap: 4px; }
.g-head .btn { display: inline-flex; align-items: center; gap: 6px; }
.guest-add2.guest-add3 { display: flex; flex-wrap: wrap; align-items: center; }
.guest-add3 .seg { flex: 0 0 auto; }
.guest-add3 #guest-name { flex: 2 1 260px; }
.guest-add3 #guest-phone { flex: 1 1 200px; }
.guest-add3 select { flex: 0 1 170px; }
.guest-add3 .btn { flex: 0 0 auto; }
.gl-row .inv-line, .gl-row .pz { grid-column: 1 / -1; }
.inv-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.inv-line .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 13px; }
.inv-line .btn:disabled { opacity: .5; cursor: wait; }
.inv-line .chip { display: inline-flex; align-items: center; gap: 4px; }
.link-field { flex: 1 1 260px; min-width: 0; font-size: 13px !important; padding: 7px 12px !important; border-radius: 999px !important; background: var(--bg) !important; color: var(--accent-text) !important; }
.gl-phone { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
@media (max-width: 560px) { .guest-add3 .seg { flex: 1 1 100%; } .guest-add3 select { flex: 1 1 140px; } }
.flow { display: grid; gap: 10px; background: var(--bg); border-radius: 18px; padding: 14px; }
.flow-step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.flow-step .step-n { background: var(--accent); color: var(--accent-ink); width: 28px; height: 28px; }
.flow-step b { font-size: 15px; }
.design-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 8px; max-width: 560px; }
.design-card { position: relative; display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 8px; cursor: pointer; }
.design-card.on { border-color: var(--accent-text); box-shadow: 0 6px 16px -10px var(--accent-text); }
.design-card input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.design-card input:focus-visible + * { outline: 2px solid var(--accent-text); }
.design-card img, .design-yo { width: 96px; height: 50px; border-radius: 10px; object-fit: cover; }
.design-yo { display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font-size: 22px; }
.design-card b { display: block; font-size: 14px; }
.design-card small { color: var(--muted); font-size: 12px; }
.pz { border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; background: var(--bg); }
.pz summary { cursor: pointer; padding: 10px 0; font-weight: 700; font-size: 13px; color: var(--accent-text); display: flex; align-items: center; gap: 6px; }
.pz[open] { padding-bottom: 12px; }
.send-sum { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--muted); }
.send-sum b { color: var(--ink); font-size: 16px; }
.send-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 12px; border-bottom: 1px solid var(--line); }
.send-row:last-child { border-bottom: 0; }
.send-row .pz { grid-column: 1 / -1; }
.send-main { display: grid; gap: 4px; min-width: 0; }
.send-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; }
.send-meta .chip { display: inline-flex; align-items: center; gap: 4px; }
.send-note { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.send-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.send-actions .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 13px; }
.wa-btn { background: #25D366 !important; color: #0B3B1F !important; }
@media (max-width: 560px) { .send-row { grid-template-columns: 1fr; } .send-actions { justify-content: flex-start; } .hide-sm { display: none; } }
.top-right { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.acct-btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent-text); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; }
.acct-btn:hover { background: var(--accent-soft); }
.acct { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent-text); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px; font-weight: 600; max-width: 100%; }
.acct-mail { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.auth-card { max-width: 440px; }
.google-btn { justify-self: center; width: 100%; max-width: 320px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: #FFFFFF; color: #2A2F3A; border: 1.5px solid #E3E5EA; box-shadow: 0 2px 6px rgba(0,0,0,.06); padding: 11px 18px; }
.google-btn:hover { border-color: #C9CDD6; }
.or { display: flex; align-items: center; gap: 10px; color: #8A909C; font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: #EEE7F2; }
.auth-form { display: grid; gap: 8px; justify-items: center; }
.auth-form input { max-width: 320px; font-size: 16px; text-align: center; border-radius: 999px; padding: 11px 14px; background: #fff; color: #2A2F3A; border: 1px solid #E6DDEC; }
.auth-form .btn { display: inline-flex; align-items: center; gap: 6px; }
.auth-sent { display: flex; gap: 12px; text-align: left; background: #EAF7EF; color: #1F5A39; border-radius: 16px; padding: 14px; font-size: 14px; }
.auth-sent svg { flex: none; width: 28px; height: 28px; }
.have-acct { font-size: 13px; color: #6B7180; }
.cf-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cf-opt { display: grid; gap: 4px; justify-items: center; text-align: center; border: 1.5px solid #E6DDEC; background: #fff; color: #2A2F3A; border-radius: 18px; padding: 16px 12px; }
.cf-opt:hover { border-color: #86CCF2; }
.cf-opt span { font-size: 12px; color: #6B7180; }
@media (max-width: 520px) { .cf-options { grid-template-columns: 1fr; } .acct-mail { max-width: 120px; } }
.save-row { display: flex; align-items: center; justify-content: flex-end; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
.save-btn { display: inline-flex; align-items: center; gap: 6px; }
.dirty-msg { display: none; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #8A6500; background: #FFF2C4; border-radius: 999px; padding: 4px 12px; }
#setup-form.dirty .dirty-msg { display: inline-flex; }
#setup-form.dirty .save-btn { box-shadow: 0 0 0 4px var(--accent-soft), 0 8px 18px -8px var(--accent); }
#setup-form .pick-err { margin-right: auto; }
.reset-zone { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
.reset-confirm { background: #FDF3EF; border: 1px solid #F3C9B8; border-radius: 16px; padding: 14px; display: grid; gap: 10px; color: #6B2E16; font-size: 14px; }
.btn.danger-btn { background: #C2562A; color: #fff; display: inline-flex; align-items: center; gap: 6px; }
.onb { background: var(--surface); border: 2px solid var(--accent); border-radius: 28px; padding: 24px 22px; display: grid; gap: 18px; box-shadow: 0 18px 40px -28px var(--accent); animation: pop .4s cubic-bezier(.2,1.3,.4,1); }
.onb-top { display: grid; gap: 8px; }
.onb-top h2 { font-size: clamp(22px, 4vw, 28px); }
.onb-step { justify-self: start; display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent-text); border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.onb-form { display: grid; gap: 16px; }
.onb-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; background: var(--bg); border-radius: 20px; padding: 14px; }
.onb-gt { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--accent-text); }
.onb-q { display: grid; gap: 5px; align-content: start; }
.onb-label { font-weight: 700; font-size: 14px; }
.onb-label small { font-weight: 400; color: var(--muted); }
.onb-q input { font-size: 16px; padding: 11px 12px; border-radius: 12px; background: var(--surface); }
.onb-help { font-size: 12px; color: var(--muted); }
.onb-btn { justify-self: center; display: inline-flex; align-items: center; gap: 8px; font-size: 16px; padding: 13px 26px; }
.onb-after { display: flex; align-items: center; gap: 8px; justify-content: center; text-align: center; font-size: 13px; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.table-wrap { position: relative; }
/* Seguro: la página nunca se desplaza de costado en el celular */
html, body { overflow-x: hidden; max-width: 100%; }
@supports (overflow-x: clip) { html, body { overflow-x: clip; } }
table.budget { min-width: 640px; }
.cell-name { font-weight: 700; border-color: transparent !important; background: transparent !important; padding: 4px 6px !important; margin-left: -6px; }
.cell-name:hover, .cell-name:focus { border-color: var(--line) !important; background: var(--surface) !important; }
td.num .cat-tip { text-align: right; margin-left: auto; }
.budget-note { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent-text); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
.budget-note.over { background: var(--blush); color: var(--warn); }
.budget-add { margin: 14px 0 6px; }
.total-row td { background: var(--accent-soft); }
.sheet-summary { display: grid; gap: 10px; margin-bottom: 18px; }

* { box-sizing: border-box; }

.rbtn { display: inline-flex; align-items: center; gap: 5px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; transition: all .2s; }
.rbtn svg { width: 16px; height: 16px; }
.rbtn.yes:hover, .rbtn.yes.on { border-color: var(--ok); color: var(--ok); }
.rbtn.no:hover, .rbtn.no.on { border-color: var(--warn); color: var(--warn); }
.rbtn.yes.on { background: var(--ok); color: #fff; }
.rbtn.no.on { background: var(--warn); color: #fff; }
@media (max-width: 640px) {
  .guest-add2 { grid-template-columns: 1fr 1fr; }
  .guest-add2 #guest-name, .guest-add2 .seg { grid-column: 1 / -1; }
  .seg { justify-content: space-between; }
  .gl-row { grid-template-columns: 1fr auto; }
  .gl-row .rsvp { grid-column: 1 / 2; }
  .rbtn span { display: none; }
  .rbtn { padding: 8px 12px; }
  .flabel { min-width: 100%; }
}
.guest { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.guest:last-child { border-bottom: 0; }
.guest select { width: auto; padding: 5px 8px; font-size: 13px; }
.x { background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: 6px; }
.x:hover { color: var(--warn); }

.sched { display: grid; gap: 0; }
.slot { display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.slot time { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.slot .who { font-size: 13px; color: var(--accent-text); font-weight: 600; }
.slot.pre time { color: var(--muted); }

.ideas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; }
.idea ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.idea li b { font-weight: 600; }
.section-intro { margin-bottom: 16px; max-width: 70ch; }
a.btn { text-decoration: none; display: inline-block; }
.kv { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 10px; font-size: 14px; padding: 3px 0; }
.kv span:last-child { word-break: break-word; min-width: 0; }
.ficha-task { display: grid; gap: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
.ficha-task h3 { font-size: 15px; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.itin-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.itin-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; padding: 10px; align-items: center; }
.itin-row .itin-desc { grid-column: 1 / -1; }
.itin-card { background: var(--surface); border: 1.5px solid var(--accent); border-radius: 16px; padding: 28px 22px; text-align: center; }
.itin-eyebrow { letter-spacing: .2em; text-transform: uppercase; font-size: 12px; color: var(--accent-text); font-weight: 600; }
.itin-title { font-size: 28px; margin: 6px 0; }
.itin-sub { color: var(--muted); margin-bottom: 18px; }
.itin-list { list-style: none; padding: 0; margin: 0 auto; text-align: left; max-width: 380px; }
.itin-list li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.itin-list li:last-child { border-bottom: 0; }
.itin-list time { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.itin-list p { color: var(--muted); font-size: 14px; }
.itin-foot { margin-top: 18px; }
@media (max-width: 760px) { .itin-layout { grid-template-columns: 1fr; } }
.msgs { display: grid; gap: 12px; }
.msg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.msg-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
.msg-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.msg-actions .btn { padding: 7px 14px; font-size: 14px; }
.msg pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--font-body); font-size: 14px; background: var(--accent-soft); border-radius: 8px; padding: 12px; }

@media (max-width: 560px) {
  .guest-add { grid-template-columns: 1fr; }
  .guest { grid-template-columns: 1fr auto auto; }
  .guest .g-group { display: none; }
  .task-row { grid-template-columns: auto 1fr; }
  .task-row .chip { grid-column: 2; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

        ${[["invitados","Invitados","users"],["ruta","Ruta","footprints"],["ficha","Ficha","clipboard-list"],["presupuesto","Presupuesto","piggy-bank"],["itinerario","Itinerario","scroll-text"],["dia","Cronograma","clock"],["ideas","Ideas","lightbulb"]].map(([id, l, i]) =>

  // Paso 1 guiado: los datos básicos del evento
  function onboardingView(totalSteps) {
    const s = state.setup;
    const who = babyName() ? "de " + esc(babyName()) : "";
    const tipo = s.tipo;
    const H = isCumple() ? {
      intro: "Contanos lo básico de " + esc(titleInSentence()) + ". Con esto calculamos cuántos días faltan, cuánto podés gastar por invitado y el horario del día.",
      fecha: { infantil: "Un sábado o domingo. Si cae en semana, el fin de semana más cercano.", adulto: "Viernes o sábado a la noche es lo más convocante.", quince: "Los mejores sábados se reservan con hasta un año." }[tipo] || "",
      hora: (s.momento === "noche"
        ? { infantil: "De noche, mejor que termine antes de las 22 h: al otro día hay que levantarse.", adulto: "Una cena arranca 21 h; una fiesta, 22 h.", quince: "Lo clásico es 21:30 h. El salón te dice el horario de cierre." }
        : { infantil: "Después de la siesta, a las 16 h. El horario de retiro lo ponés en la invitación.", adulto: "Un asado arranca 13 h; una merienda o tarde de juegos, 17 h.", quince: "Fiesta de día: 13 h con almuerzo o 17 h con merienda." })[tipo] || "",
      inv: tipo === "infantil" ? "¿Cuántos nenes calculás?" : "¿Cuántos invitados calculás?",
      invHelp: tipo === "infantil" ? "Los adultos que se quedan los sumás después en la lista." : "Un número aproximado alcanza; después lo ajustás con la lista.",
      lugarPh: { infantil: "Ej: salón Pelotero Feliz", adulto: "Ej: casa, bar o quincho", quince: "Ej: salón Los Aromos" }[tipo] || ""
    } : null;
    const q = (id, key, type, label, help, ph, extra, req) => `
      <label class="onb-q" for="${id}">
        <span class="onb-label">${label}${req ? "" : ' <small>(opcional)</small>'}</span>
        <input type="${type}" id="${id}" data-onb="${key}" value="${esc(s[key] || "")}" placeholder="${ph || ""}" ${extra || ""} ${req ? "required" : ""}>
        ${help ? `<span class="onb-help">${help}</span>` : ""}

    return `
      <section class="onb">
        <div class="onb-top">
          <span class="onb-step">${ic("footprints")} Paso 1 de ${totalSteps}</span>
          <h2>¡Genial! Ahora hagamos el primer paso</h2>
          <p class="muted">${H ? H.intro : `Contanos lo básico del baby shower ${who}. Con esto calculamos cuántos días faltan, cuánto podés gastar por invitado y el horario del día.`}</p>
        </div>
        <form id="onb-form" class="onb-form" novalidate>
          <div class="onb-group">
            <p class="onb-gt">${ic("calendar-heart")} ¿Cuándo?</p>
            ${q("o-fecha", "fecha", "date", "¿Qué día es?", H ? H.fecha : "Lo ideal es entre la semana 28 y 34 de embarazo, un sábado o domingo.", "", "", true)}
            ${q("o-hora", "hora", "time", "¿A qué hora empieza?", H ? H.hora : "Brunch 11 h, merienda 16 h, after 19 h.", "", "", true)}
          </div>
          <div class="onb-group">
            <p class="onb-gt">${ic("users")} ¿Cuántos y cuánto?</p>
            ${q("o-inv", "invitados", "number", H ? H.inv : "¿Cuántos invitados calculás?", H ? H.invHelp : "Un número aproximado alcanza; después lo ajustás con la lista.", "Ej: 30", 'min="1" inputmode="numeric"', true)}
            ${q("o-pres", "presupuesto", "number", "¿Cuánto querés gastar en total? ($)", "Aunque sea estimado. Te lo repartimos por rubro.", "Ej: 400000", 'min="1" step="1000" inputmode="numeric"', true)}
          </div>
          <div class="onb-group">
            ${H ? `<p class="onb-gt">${ic("map-pin")} ¿Dónde?</p>
            ${q("o-lugar", "lugar", "text", "Lugar", "Si todavía no lo tenés, lo cargás después.", H.lugarPh, "", false)}
            ${tipo === "adulto" ? `<label class="onb-check"><input type="checkbox" id="o-sorp" data-onb="sorpresa" ${s.sorpresa ? "checked" : ""}> <span><b>Es una fiesta sorpresa</b><br><small>Te sumamos los pasos para que no se entere.</small></span></label>` : ""}` : `
            <p class="onb-gt">${ic("heart")} ¿Quiénes y dónde?</p>
            ${q("o-mama", "nombre", "text", "Nombre de la mamá", "", "Ej: Caro", "", false)}
            ${q("o-papa", "papa", "text", "Nombre del papá", "", "Ej: Juan", "", false)}
            ${q("o-lugar", "lugar", "text", "Lugar", "Si todavía no lo tenés, lo cargás después.", "Ej: casa de la abuela", "", false)}`}
          </div>
          <p class="pick-err" id="onb-err" role="alert" hidden>Completá la fecha, la hora, los invitados y el presupuesto para seguir.</p>
          <button class="btn onb-btn" type="submit">${ic("sparkles")} Guardar y empezar mi ruta</button>
        </form>
        <p class="onb-after">${ic("map")} Después te mostramos tu ruta: ${totalSteps - 1} tareas en ${PHASES.length} fases, presupuesto, invitados, invitaciones e itinerario.</p>
      </section>`;
  }

  function panel() {
    if (tab === "presupuesto") return budgetView();
    if (tab === "invitados") return guestsView();
    if (tab === "dia") return dayView();
    if (tab === "ideas") return ideasView();
    if (tab === "invitaciones") return guestsView();
    if (tab === "ficha") return fichaView();
    if (tab === "itinerario") return itinView();
    return routeView();
  }

  function routeView() {
    const tasks = allTasks();
    return PHASES.map((p, i) => {
      const ts = tasks.filter(t => t.phase === p.id);
      const d = ts.filter(t => state.done[t.id]).length;
      const hiddenN = TASKS.filter(t => t.phase === p.id && (state.hidden || {})[t.id]).length;
      return `
        <section class="phase">
          <div class="rail"><span class="n ${ts.length && d === ts.length ? "full" : ""}">${ts.length && d === ts.length ? "✓" : i + 1}</span>${i < PHASES.length - 1 ? '<span class="line"></span>' : ""}</div>
          <div class="phase-body">
            <div class="phase-title"><h2>${p.name}</h2><span class="muted">${d} de ${ts.length} ${ts.length === 1 ? "hecha" : "hechas"}</span></div>
            <div class="tasks">${ts.map(taskView).join("")}</div>
            <form class="add-task" data-phase="${p.id}">
              <input type="text" id="add-${p.id}" placeholder="Agregar una tarea a esta fase…" aria-label="Nueva tarea para ${p.name}">
              <input type="date" id="add-d-${p.id}" aria-label="Fecha límite (opcional)" title="Fecha límite (opcional)">
              <button class="btn ghost" type="submit">${ic("plus")} Agregar</button>
            </form>
            ${hiddenN ? `<button class="link-btn" data-act="restore" data-id="${p.id}">${ic("rotate-ccw")} Recuperar ${hiddenN === 1 ? "1 tarea quitada" : hiddenN + " tareas quitadas"}</button>` : ""}
          </div>
        </section>`;
    }).join("");
  }

  function taskView(t) {
    const st = status(t);
    const note = state.notes[t.id] || "";
    return `
      <div class="task ${state.done[t.id] ? "done" : ""}">
        <div class="task-row">
          <input type="checkbox" id="c-${t.id}" data-act="check" data-id="${t.id}" ${state.done[t.id] ? "checked" : ""} aria-label="${esc(t.title)}">
          <label for="c-${t.id}" class="t-title">${esc(t.title)}</label>
        </div>
        <details id="d-${t.id}">
          <summary>${t.custom ? "Fecha y notas" : FIELDS[t.id] ? "Datos, consejo y notas" : "Consejo y notas"}${filledCount(t.id) ? " · " + filledCount(t.id) + " datos cargados" : note ? " · tiene notas" : ""}</summary>
          ${t.custom ? `<label class="field" style="margin-bottom:10px;max-width:220px">Fecha límite<input type="date" id="cd-${t.id}" data-cdate="${t.id}" value="${isoOf(due(t))}"></label>` : `<div class="tip"><b>Lo que haría una planner</b>${esc(t.tip)}</div>`}
          ${FIELDS[t.id] ? `<div class="setup-grid" style="margin:0 0 10px">${FIELDS[t.id].map(f => `
            <label class="field">${f.l}<input type="${f.t || "text"}" id="f-${t.id}-${f.k}" data-field="${t.id}|${f.k}" value="${esc(fget(t.id, f))}" placeholder="${esc(f.ph || "")}"${f.t === "number" ? ' min="0"' : ""}></label>`).join("")}</div>` : ""}
          <textarea id="n-${t.id}" data-note="${t.id}" placeholder="Tus notas: teléfonos, precios, links…">${esc(note)}</textarea>
          <div class="task-actions">${t.custom
            ? `<button class="link-btn danger" data-act="deltask" data-id="${t.id}">${ic("trash-2")} Eliminar tarea</button>`
            : `<button class="link-btn" data-act="hidetask" data-id="${t.id}">${ic("eye-off")} No la necesito, quitar de mi lista</button>`}</div>
        </details>
      </div>`;
  }

  // Rubros del presupuesto: arrancan con el reparto sugerido y se pueden editar, agregar y eliminar
  function budgetList() {
    return state.budget || BUDGET.map(c => ({ id: c.id, name: c.name, tip: c.tip, pct: c.pct }));
  }
  function planOf(c) {
    const total = Number(state.setup.presupuesto) || 0;
    return c.plan != null && c.plan !== "" ? Number(c.plan) || 0 : Math.round(total * (c.pct || 0) / 100);
  }
  const spentTotal = () => budgetList().reduce((a, c) => a + (Number(state.gastos[c.id]) || 0), 0);
  function editBudget(fn) { state.budget = budgetList().map(c => Object.assign({}, c)); fn(state.budget); persist(); rerenderKeepScroll(); }

  function budgetView() {
    const total = Number(state.setup.presupuesto) || 0;
    const inv = Number(state.setup.invitados) || 0;
    const list = budgetList();
    const spent = spentTotal();
    const planned = list.reduce((a, c) => a + planOf(c), 0);
    const rest = total - spent;
    const gap = total - planned;
    return `
      <p class="section-intro muted">Arrancás con el reparto que usaría una planner. Cambiá los nombres y montos, sumá los rubros que te falten y borrá los que no uses. Cargá lo gastado y mirá cuánto te queda.${inv ? ` Con ${inv} invitados, tu presupuesto da ${money(total / inv)} por persona.` : ""}</p>
      ${gap !== 0 && total ? `<div class="budget-note ${gap < 0 ? "over" : ""}">${ic(gap < 0 ? "triangle-alert" : "info")} ${gap < 0 ? `Asignaste ${money(-gap)} más que tu presupuesto total.` : `Te quedan ${money(gap)} sin asignar a ningún rubro.`}</div>` : ""}
      <div class="table-wrap"><table class="budget">
        <thead><tr><th>Rubro</th><th class="num">Asignado</th><th class="num">Gastado</th><th class="num">Queda</th><th><span class="sr">Eliminar</span></th></tr></thead>
        <tbody>
          ${list.map(c => {
            const plan = planOf(c);
            const g = Number(state.gastos[c.id]) || 0;
            const diff = plan - g;
            return `<tr>
              <td><input type="text" class="cell-name" id="bn-${c.id}" data-bname="${c.id}" value="${esc(c.name)}" aria-label="Nombre del rubro">${c.tip ? `<div class="cat-tip">${esc(c.tip)}</div>` : ""}</td>
              <td class="num"><input type="number" min="0" step="1000" id="bp-${c.id}" data-bplan="${c.id}" value="${plan || ""}" placeholder="0" aria-label="Asignado a ${esc(c.name)}">${total ? `<div class="cat-tip">${Math.round(plan / total * 100)}% del total</div>` : ""}</td>
              <td class="num"><input type="number" min="0" step="500" id="g-${c.id}" data-gasto="${c.id}" value="${g || ""}" placeholder="0" aria-label="Gastado en ${esc(c.name)}"></td>
              <td class="num ${diff < 0 ? "neg" : g ? "pos" : ""}">${money(diff)}</td>
              <td><button class="x" data-act="delbudget" data-id="${c.id}" aria-label="Eliminar ${esc(c.name)}" title="Eliminar rubro">${ic("trash-2")}</button></td>
            </tr>`;
          }).join("")}
          <tr class="total-row"><td><b>Total</b></td><td class="num"><b>${money(planned)}</b></td><td class="num"><b>${money(spent)}</b></td><td class="num ${rest < 0 ? "neg" : "pos"}"><b>${money(rest)}</b></td><td></td></tr>
        </tbody>
      </table></div>
      <form class="add-task budget-add" id="budget-form">
        <input type="text" id="nb-name" placeholder="Nuevo rubro, ej: Fotógrafo" aria-label="Nombre del nuevo rubro">
        <input type="number" id="nb-plan" min="0" step="1000" placeholder="Monto asignado" aria-label="Monto asignado">
        <button class="btn ghost" type="submit">${ic("plus")} Agregar rubro</button>
      </form>
      ${state.budget ? `<button class="link-btn" data-act="resetbudget">${ic("rotate-ccw")} Volver al reparto sugerido</button>` : ""}`;
  }


  // Filtros de la lista de invitados (solo para esta visita)
  const gFilter = { rsvp: "all", side: "all", group: "all", q: "" };
  const DEFAULT_GROUPS = ["Familia", "Amigas", "Amigos", "Trabajo", "Otros"];
  const groupList = () => state.groups || (isCumple() ? cpack().groups : DEFAULT_GROUPS);

    const s = state.setup;
    if (k === "mama") return "De " + (String(s.nombre || "").trim() || "la mamá");
    if (k === "papa") return "De " + (String(s.papa || "").trim() || "el papá");
    if (k === "ambos") return "De los dos";
    return "Sin lado";
  }

  function guestsView() {
    const g = state.guests;
    const groups = groupList();

      (gFilter.rsvp === "all" || (x.rsvp || "pend") === gFilter.rsvp) &&

      (gFilter.group === "all" || x.group === gFilter.group) &&
      (!gFilter.q || x.name.toLowerCase().includes(gFilter.q.toLowerCase())));

    const fchip = (k, v, label, n, icon) => `<button class="fchip${gFilter[k] === v ? " on" : ""}" data-act="gfilter" data-k="${k}" data-v="${esc(v)}">${icon ? ic(icon) : ""}${label}${n != null ? ` <b>${n}</b>` : ""}</button>`;
    ensureMissingInvites();
    return `
      <div class="g-head">
        <div><h2>Invitados e invitaciones</h2>
        <p class="muted">Cada invitado que agregás ya tiene su invitación lista: si tiene WhatsApp la mandás con un toque, y si no, copiás su link.</p></div>
        <button class="btn" data-act="syncrsvp" ${syncing ? "disabled" : ""}>${ic("refresh-cw")} ${syncing ? "Actualizando…" : "Actualizar confirmaciones"}</button>
      </div>
      <div class="rtiles" role="group" aria-label="Filtrar por respuesta">
        ${[["all", "Todos", "users", g.length, g.length === 1 ? "invitado" : "invitados"],
           ["si", "Vienen", "circle-check", by("rsvp", "si"), people + (people === 1 ? " persona" : " personas")],
           ["pend", "Sin responder", "hourglass", by("rsvp", "pend"), "faltan confirmar"],
           ["no", "No vienen", "circle-x", by("rsvp", "no"), "no pueden ir"]].map(([v, l, icon, n, sub]) => `
          <button class="rtile t-${v}${gFilter.rsvp === v ? " on" : ""}" data-act="gfilter" data-k="rsvp" data-v="${v}" aria-pressed="${gFilter.rsvp === v}">
            <span class="rt-ico">${ic(icon)}</span><span class="rt-n">${n}</span><span class="rt-l">${l}</span><span class="rt-sub">${sub}</span>
          </button>`).join("")}
      </div>
      <form class="guest-add2 guest-add3" id="guest-form">
        <input type="text" id="guest-name" placeholder="Nombre como aparece en la invitación" aria-label="Nombre del invitado" required>
        <input type="tel" id="guest-phone" placeholder="WhatsApp (opcional) ej: 5492215551234" aria-label="WhatsApp del invitado">
        ${useSides() ? `<div class="seg" role="radiogroup" aria-label="De parte de">
          ${["mama", "papa", "ambos"].map(k => `<label class="seg-opt"><input type="radio" name="guest-side" value="${k}" ${(state.lastSide || "ambos") === k ? "checked" : ""}><span>${esc(sideLabel(k))}</span></label>`).join("")}
        </div>` : ""}
        <select id="guest-group" aria-label="Categoría">${groups.map(x => `<option ${state.lastGroup === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
        <button class="btn" type="submit">${ic("user-plus")} Agregar</button>
      </form>
      <details class="cat-edit" id="cat-edit">
        <summary>${ic("tags")} Categorías: ${groups.map(esc).join(", ")}</summary>
        <div class="cat-list">${groups.map(x => `<span class="cat-pill">${esc(x)}<button type="button" class="x" data-act="delgroup" data-v="${esc(x)}" aria-label="Quitar categoría ${esc(x)}">${ic("x")}</button></span>`).join("")}</div>
        <form id="group-form" class="cat-add"><input type="text" id="new-group" placeholder="Nueva categoría, ej: Vecinos" aria-label="Nueva categoría"><button class="btn ghost" type="submit">${ic("plus")} Crear</button></form>
      </details>

      <div class="gtools">
        <label class="gsearch-wrap">${ic("search")}<input type="text" id="guest-q" value="${esc(gFilter.q)}" placeholder="Buscar invitado…" aria-label="Buscar invitado"></label>
        ${useSides() ? `        <label class="pill-select">${ic("heart-handshake")}<select id="f-side" data-gf="side" aria-label="De parte de">
          <option value="all">De parte de todos</option>
          ${["mama", "papa", "ambos"].map(k => `<option value="${k}" ${gFilter.side === k ? "selected" : ""}>${esc(sideLabel(k))} (${by("side", k)})</option>`).join("")}
          ${by("side", "") ? `<option value="" ${gFilter.side === "" ? "selected" : ""}>Sin lado (${by("side", "")})</option>` : ""}
        </select></label>` : ""}
        <label class="pill-select">${ic("tags")}<select id="f-group" data-gf="group" aria-label="Categoría">
          <option value="all">Todas las categorías</option>
          ${groups.map(x => `<option ${gFilter.group === x ? "selected" : ""}>${esc(x)}</option>`).join("")}
        </select></label>
        ${gFilter.rsvp !== "all" || gFilter.side !== "all" || gFilter.group !== "all" || gFilter.q ? `<button class="link-btn" data-act="gclear">${ic("x")} Limpiar filtros</button>` : ""}
      </div>

      ${g.length ? (shown.length ? `<div class="table-wrap glist">${shown.map(x => {
        const r = x.rsvp || "pend";
        return `
        <div class="gl-row ${r}">
          <div class="gl-main">
            <span class="gl-name">${esc(x.name)}</span>
            <span class="gl-tags">
              ${useSides() ? `              <button class="tag side-${x.side || "none"}" data-act="cycleside" data-id="${x.id}" title="Cambiar de parte de quién">${ic(SIDE_ICON[x.side || ""])}${esc(sideLabel(x.side || ""))}</button>` : ""}
              <select class="tag tag-select" id="gg-${x.id}" data-ggroup="${x.id}" aria-label="Categoría de ${esc(x.name)}">${(groups.includes(x.group) ? groups : groups.concat([x.group])).map(o => `<option ${o === x.group ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>
            </span>
            ${x.phone ? `<span class="muted gl-phone">${ic("phone")} ${esc(x.phone)}</span>` : ""}
          </div>
          ${r === "pend" ? `<div class="rsvp" role="group" aria-label="Respuesta de ${esc(x.name)}">
            <button class="rbtn yes" data-act="rsvp" data-id="${x.id}" data-v="si" title="Viene">${ic("check")}<span>Viene</span></button>
            <button class="rbtn no" data-act="rsvp" data-id="${x.id}" data-v="no" title="No viene">${ic("x")}<span>No viene</span></button>
          </div>` : `<div class="rstate ${r}">
            <span class="rbadge">${ic(r === "si" ? "circle-check" : "circle-x")} ${r === "si" ? "Viene" : "No viene"}</span>

        return dl.save({ filename: "itinerario-baby-shower.html", data: new Blob([html], { type: "text/html" }) })
          .then(() => say("Listo. Abrí el archivo y usá Imprimir: entra en una hoja A4."),
                e => say(e && e.code === "declined" ? "" : "No se pudo descargar. Probá de nuevo en un momento."));
      });
    }
    else if (act === "rsvp") {
      const g = state.guests.find(x => x.id === id); if (!g) return;
      const v = el.dataset.v; g.rsvp = g.rsvp === v ? "pend" : v;
      if (g.rsvp === "si") { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); }
      persist(); rerenderKeepScroll();
    }
    else if (act === "plus") {
      const g = state.guests.find(x => x.id === id); if (!g) return;
      g.plus = Math.max(0, Math.min(20, (Number(g.plus) || 0) + Number(el.dataset.d)));
      persist(); rerenderKeepScroll();
    }
    else if (act === "cycleside") {
      const g = state.guests.find(x => x.id === id); if (!g) return;
      const order = ["mama", "papa", "ambos"]; g.side = order[(order.indexOf(g.side) + 1) % 3];
      persist(); rerenderKeepScroll();
    }
    else if (act === "gfilter") { gFilter[el.dataset.k] = el.dataset.v; rerenderKeepScroll(); }
    else if (act === "gclear") { gFilter.rsvp = gFilter.side = gFilter.group = "all"; gFilter.q = ""; rerenderKeepScroll(); }
    else if (act === "delgroup") {
      const v = el.dataset.v; const left = groupList().filter(x => x !== v);
      if (!left.length) { toast("Dejá al menos una categoría", "info"); return; }
      state.groups = left; if (gFilter.group === v) gFilter.group = "all";
      persist(); rerenderKeepScroll(); toast("Categoría quitada: " + v + ". Los invitados la conservan.", "tags");
    }
    else if (act === "delguest" && (state.guests.find(x => x.id === id) || {}).token && sb && state.inviteKey) {
      const tk = state.guests.find(x => x.id === id).token;
      sb.rpc("delete_invite", { p_key: state.inviteKey, p_token: tk }).then(() => {});
      state.guests = state.guests.filter(g => g.id !== id); persist(); rerenderKeepScroll();
    }
    else if (act === "delguest") { state.guests = state.guests.filter(g => g.id !== id); persist(); rerenderKeepScroll(); }
  });
  app.addEventListener("change", ev => {
    const el = ev.target;
    if (el.dataset.act === "check") {
      state.done[el.dataset.id] = el.checked; if (!el.checked) delete state.done[el.dataset.id];
      if (el.checked) {
        const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2);
        const t = allTasks().find(x => x.id === el.dataset.id);
        const ph = t && PHASES.find(p => p.id === t.phase);
        if (ph && allTasks().filter(x => x.phase === ph.id).every(x => state.done[x.id])) setTimeout(() => toast("¡Fase completa: " + ph.name + "!", "party-popper"), 350);
      }
    }
    else if (el.dataset.setup) { const k = el.dataset.setup; state.setup[k] = el.type === "number" ? Number(el.value) || 0 : el.value; }
    else if (el.dataset.bname) { editBudget(l => { const c = l.find(x => x.id === el.dataset.bname); if (c && el.value.trim()) c.name = el.value.trim(); }); return; }
    else if (el.dataset.bplan) { editBudget(l => { const c = l.find(x => x.id === el.dataset.bplan); if (c) c.plan = el.value === "" ? null : Number(el.value) || 0; }); return; }
    else if (el.dataset.gasto) { state.gastos[el.dataset.gasto] = Number(el.value) || 0; }
    else if (el.name === "inv-mode") {
      state.inv = Object.assign({}, state.inv, { diseno: el.value });
      persist(); rerenderKeepScroll();
      return;
    }
    else if (el.name === "pick-moment") { const err = document.getElementById("pick-err"); if (err) err.hidden = true; return; }
    else if (el.id === "pick-noname") {
      const n = document.getElementById("pick-name"); const err = document.getElementById("pick-err");
      if (n) { n.disabled = el.checked; if (el.checked) n.value = ""; else n.focus(); }
      if (err) err.hidden = true;
      return;
    }
    else if (el.dataset.gf) { gFilter[el.dataset.gf] = el.value; rerenderKeepScroll(); return; }
    else if (el.dataset.gnote) { const g = state.guests.find(x => x.id === el.dataset.gnote); if (g) g.note = el.value.trim(); persist(); return; }
    else if (el.dataset.gp) {
      const [gid, k] = el.dataset.gp.split("|"); const g = state.guests.find(x => x.id === gid); if (!g) return;
      g[k] = el.value.trim(); persist();
      if (g.token && k !== "phone") ensureInvite(g, true);
      return;
    }
    else if (el.dataset.ggroup) { const g = state.guests.find(x => x.id === el.dataset.ggroup); if (g) g.group = el.value; }
    else if (el.dataset.sent) { const g = state.guests.find(x => x.id === el.dataset.sent); if (g) g.sent = el.checked; }
    else if (el.dataset.canal) { const g = state.guests.find(x => x.id === el.dataset.canal); if (g) g.canal = el.value; }
    else if (el.dataset.inv) { state.inv = Object.assign({}, state.inv, { [el.dataset.inv]: el.value }); }
    else if (el.dataset.cdate) { const c = (state.custom || []).find(x => x.id === el.dataset.cdate); if (c) c.off = offFromIso(el.value, c.off); }
    else if (el.dataset.field) { const [tid, k] = el.dataset.field.split("|"); const f = (FIELDS[tid] || []).find(x => x.k === k); if (f) fset(tid, f, el.value); }
    else if (el.dataset.itinmeta) { state.itinMeta = Object.assign({}, state.itinMeta, { [el.dataset.itinmeta]: el.value.trim() }); }
    else if (el.dataset.itin) {
      const [id, k] = el.dataset.itin.split("|");
      editItin(list => { const x = list.find(y => y.id === id); if (!x) return; if (k === "hora") x.min = toMin(el.value) - toMin(state.setup.hora); else x[k] = el.value; });
      return;
    }
    else if (el.dataset.note) { state.notes[el.dataset.note] = el.value; persist(); return; }
    else return;
    persist(); rerenderKeepScroll();
  });
  app.addEventListener("focusin", ev => { if (ev.target.classList && ev.target.classList.contains("link-field")) setTimeout(() => ev.target.select(), 0); });
  let qTimer = null;
  app.addEventListener("input", ev => {
    if (ev.target.dataset && ev.target.dataset.sf) { const f = document.getElementById("setup-form"); if (f) f.classList.add("dirty"); return; }
    if (ev.target.id !== "guest-q") return;
    gFilter.q = ev.target.value; clearTimeout(qTimer);
    qTimer = setTimeout(() => { const pos = ev.target.selectionStart; rerenderKeepScroll(); setTimeout(() => { const q = document.getElementById("guest-q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }, 20); }, 250);
  });
  app.addEventListener("submit", ev => {
    if (ev.target.classList.contains("add-task") && ev.target.dataset.phase) {
      ev.preventDefault();
      const ph = ev.target.dataset.phase;
      const title = document.getElementById("add-" + ph).value.trim();
      if (!title) return;
      const off = offFromIso(document.getElementById("add-d-" + ph).value, PHASE_OFF[ph]);
      state.custom = (state.custom || []).concat([{ id: "c" + Date.now().toString(36), phase: ph, off, title }]);
      persist(); rerenderKeepScroll(); toast("Tarea agregada", "plus");
      setTimeout(() => { const inp = document.getElementById("add-" + ph); if (inp) inp.focus(); }, 30);
      return;
    }
    if (ev.target.id === "auth-form") {
      ev.preventDefault();
      const em = document.getElementById("auth-email").value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { authErr = "Escribí un email válido."; render(); return; }
      const btn = ev.target.querySelector("button"); if (btn) { btn.disabled = true; btn.textContent = "Enviando…"; }
      sendMagicLink(em);
      return;
    }
    if (ev.target.id === "setup-form") {
      ev.preventDefault();
      const f = ev.target, vals = {};
      f.querySelectorAll("[data-sf]").forEach(inp => { vals[inp.dataset.sf] = inp.type === "checkbox" ? inp.checked : inp.value.trim(); });
      const bad = ["fecha", "hora", "invitados", "presupuesto"].map(k => f.querySelector(`[data-sf="${k}"]`))
        .filter(inp => inp && (!inp.value.trim() || (inp.type === "number" && !(Number(inp.value) > 0))));
      f.querySelectorAll(".shake").forEach(x => x.classList.remove("shake"));
      if (bad.length) { bad.forEach(inp => { void inp.offsetWidth; inp.classList.add("shake"); }); bad[0].focus(); const e = document.getElementById("setup-err"); if (e) e.hidden = false; return; }
      Object.keys(vals).forEach(k => { state.setup[k] = (k === "invitados" || k === "presupuesto" || k === "edad") ? Number(vals[k]) || 0 : vals[k]; });
      if (isCumple() && !String(state.setup.cumpleNombre || "").trim()) state.setup.cumpleNombre = "Cumpleañero";
      openSet.delete("setup");
      persist(); rerenderKeepScroll();
      toast("Cambios guardados", "check");
      return;
    }
    if (ev.target.id === "onb-form") {
      ev.preventDefault();
      const vals = {};
      ev.target.querySelectorAll("[data-onb]").forEach(inp => { vals[inp.dataset.onb] = inp.type === "checkbox" ? inp.checked : inp.value.trim(); });
      const missing = [...ev.target.querySelectorAll("[data-onb][required]")].filter(inp => !inp.value.trim() || (inp.type === "number" && !(Number(inp.value) > 0)));
      ev.target.querySelectorAll(".shake").forEach(x => x.classList.remove("shake"));
      if (missing.length) {
        missing.forEach(inp => { void inp.offsetWidth; inp.classList.add("shake"); });
        missing[0].focus();
        const err = document.getElementById("onb-err"); if (err) err.hidden = false;
        return;
      }
      Object.keys(vals).forEach(k => { if (k !== "invitados" && k !== "presupuesto") state.setup[k] = typeof vals[k] === "boolean" ? vals[k] : (vals[k] || ""); });
      state.setup.invitados = Number(vals.invitados) || 0;
      state.setup.presupuesto = Number(vals.presupuesto) || 0;
      persist(); render(); window.scrollTo(0, 0);
      const bar = document.querySelector(".stat .bar");
      if (bar) { const r = bar.getBoundingClientRect(); burst(r.left + 20, r.top); }
      toast("¡Primer paso hecho! Ya tenés tu ruta", "party-popper");
      return;
    }
    if (ev.target.id === "budget-form") {
      ev.preventDefault();
      const name = document.getElementById("nb-name").value.trim();
      if (!name) return;
      const v = document.getElementById("nb-plan").value;
      editBudget(l => l.push({ id: "b" + Date.now().toString(36), name, tip: "", pct: 0, plan: v === "" ? 0 : Number(v) || 0 }));
      toast("Rubro agregado: " + name, "plus");
      return;
    }
    if (ev.target.id === "group-form") {
      ev.preventDefault();
      const v = document.getElementById("new-group").value.trim();
      if (!v) return;
      if (!groupList().some(x => x.toLowerCase() === v.toLowerCase())) state.groups = groupList().concat([v]);
      state.lastGroup = v; openSet.add("cat-edit");
      persist(); rerenderKeepScroll(); toast("Categoría creada: " + v, "tags");
      return;
    }
    if (ev.target.id !== "guest-form") return;
    ev.preventDefault();
    const name = document.getElementById("guest-name").value.trim();
    if (!name) return;
    const sideEl = document.querySelector('input[name="guest-side"]:checked');
    const side = useSides() ? (sideEl ? sideEl.value : "ambos") : "", group = document.getElementById("guest-group").value;
    state.lastSide = side; state.lastGroup = group;
    const phone = (document.getElementById("guest-phone") || {}).value || "";
    const ng = { id: "g" + Date.now().toString(36), name, group, side, rsvp: "pend", phone: phone.trim() };
    state.guests.push(ng);
    persist(); rerenderKeepScroll();
    const inp = document.getElementById("guest-name"); if (inp) inp.focus();
  });

  if (saveMode === "local") saveMsg = "";
  document.getElementById("sky-slot").innerHTML = skyHTML();
  window.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (authOpen) { authOpen = false; render(); return; }
    if (picker && chosen()) { picker = false; rerenderKeepScroll(); }
  });
  initAuth();
  // Primera visita: pedir nombre y nene/nena/sorpresa antes de empezar
  if (view === "plan" && !chosen()) picker = true;
  render();
  if (picker) setTimeout(() => { const n = document.getElementById("pick-name"); if (n && !n.disabled) n.focus(); }, 350);
  connect();
  if (tab === "invitaciones") tab = "invitados";
  setTimeout(() => { if (view === "plan" && tab === "invitados") syncRsvps(false); }, 1200);
})();
</script>
</body>
