<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Yo Organizo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* Layout: una columna de app; resumen arriba, pestañas, contenido. Ruta = fases en orden cronológico.
   La paleta cambia según data-baby en <html>: nene (celeste), nena (rosa), sorpresa (menta y amarillo).
   Diseño siempre claro y pastel, también en equipos con modo oscuro. */
:root {
  color-scheme: light;
  --bg: #F6F7F4;
  --surface: #FFFFFF;
  --ink: #2A2F3A;
  --muted: #6B7180;
  --line: #E3E5EA;
  --accent: #6C6FB8;
  --accent-ink: #FFFFFF;
  --accent-soft: #ECECF8;
  --accent-text: #6C6FB8;
  --blush: #FCE8D6;
  --blush-ink: #8A4E22;
  --warn: #C2562A;
  --ok: #2E8B57;
  --deco: #B9BBE6;
  --font-display: "Fredoka", "Avenir Next Rounded", "Segoe UI", sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
}

/* Paletas del bebé */
:root[data-baby="nene"] { --bg: #EEF8FE; --line: #D3ECFA; --accent: #86CCF2; --accent-ink: #0F3A5A; --accent-soft: #DCF1FC; --accent-text: #2B8AC6; --blush: #FFF4CF; --blush-ink: #7A5A00; --deco: #BCE3F8; --ink: #22384D; --muted: #5C7389; }
:root[data-baby="nena"] { --bg: #FFF5F8; --line: #F6E1E8; --accent: #F5AFC6; --accent-ink: #5A1E35; --accent-soft: #FDE7EF; --accent-text: #C2557F; --blush: #FFEADF; --blush-ink: #8A4128; --deco: #F9CCDB; --ink: #3A2830; --muted: #846A74; }
:root[data-baby="sorpresa"] { --bg: #F3FBF7; --line: #D9EEE4; --accent: #96DCC5; --accent-ink: #134236; --accent-soft: #E0F5EC; --accent-text: #2E8A70; --blush: #FFF2C4; --blush-ink: #7A5A00; --deco: #C2EADA; --ink: #23352F; --muted: #61776F; }
body { transition: background-color .6s ease, color .6s ease; }

/* Iconos */
.ic { width: 1.15em; height: 1.15em; stroke-width: 1.9; vertical-align: -0.2em; flex: none; }
svg.lucide { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
.icon-bubble { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font-size: 20px; }

/* Fondo decorativo que flota */
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; color: var(--deco); }
.sky span { position: absolute; display: block; animation: drift 14s ease-in-out infinite; opacity: .55; }
.sky span svg { width: 100%; height: 100%; }
@keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(12px, -18px) rotate(6deg); } }
.wrap { position: relative; z-index: 1; }

/* Selector nene / nena / sorpresa */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(255, 255, 255, .55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); animation: fade .25s ease; }
.modal-card { position: relative; background: linear-gradient(160deg, #FFFFFF 0%, #FFF8FB 45%, #F2F9FF 100%); color: #2A2F3A; border: 1px solid #EEE7F2; box-shadow: 0 30px 60px -30px rgba(120, 110, 170, .45); border-radius: 32px; padding: 34px 24px 26px; max-width: 640px; width: 100%; text-align: center; display: grid; gap: 18px; animation: pop .35s cubic-bezier(.2,1.4,.4,1); max-height: 90vh; overflow: auto; }
.modal-card .muted, .modal-card .eyebrow { color: #6B7180; }
.modal-card .pick-name input { background: #FFFFFF; border-color: #E6DDEC; color: #2A2F3A; }
.modal-card .btn.ghost { color: #6B7180; border-color: #E6DDEC; }
.modal-hero { display: flex; justify-content: center; gap: 10px; color: #F5AFC6; font-size: 26px; }
.modal-hero span:nth-child(2) { color: #86CCF2; font-size: 34px; animation: bob 3s ease-in-out infinite; }
.modal-hero span:nth-child(3) { color: #96DCC5; }
.modal-card h2 { font-size: 26px; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.choice { border: 2px solid transparent; border-radius: 22px; padding: 18px 10px; display: grid; gap: 8px; justify-items: center; font-family: var(--font-display); font-weight: 600; font-size: 17px; transition: transform .2s ease, border-color .2s; }
.choice:hover { transform: translateY(-4px); box-shadow: 0 14px 24px -16px currentColor; }
.choice .ico { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: #FFFFFF; animation: bob 3s ease-in-out infinite; }
.choice small { font-family: var(--font-body); font-weight: 400; font-size: 13px; opacity: .8; }
.choice.nene { background: #DCF1FC; color: #2B8AC6; }
.choice.nena { background: #FDE7EF; color: #B04872; }
.choice.sorpresa { background: #E0F5EC; color: #2A7D66; }
.choice.sel { border-color: currentColor; }
.choice .ico { color: inherit; }
.choice:nth-child(2) .ico { animation-delay: .4s; }
.choice:nth-child(3) .ico { animation-delay: .8s; }
.swatches { display: flex; gap: 4px; }
.swatches i { width: 14px; height: 14px; border-radius: 50%; display: block; }
@media (max-width: 520px) { .choices { grid-template-columns: 1fr; } .choice { grid-template-columns: auto 1fr auto; text-align: left; justify-items: start; align-items: center; } .choice .ico { width: 48px; height: 48px; font-size: 22px; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* Globos que suben al elegir, corazones al tildar */
.float-up { position: fixed; bottom: -80px; z-index: 60; pointer-events: none; animation: rise 2.6s cubic-bezier(.3,.6,.4,1) forwards; }
.float-up svg { width: 100%; height: 100%; }
@keyframes rise { to { transform: translate(var(--dx, 0), -115vh) rotate(var(--rot, 0deg)); opacity: .2; } }
.spark { position: fixed; z-index: 60; pointer-events: none; width: 14px; height: 14px; color: var(--accent-text); animation: burst .8s ease-out forwards; }
.spark svg { width: 100%; height: 100%; display: block; }
@keyframes burst { to { transform: translate(var(--x), var(--y)) scale(.4); opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; display: flex; gap: 8px; align-items: center; animation: toast 2.8s ease forwards; max-width: calc(100% - 32px); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px); } 12%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 10px); } }
.baby-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent-text); border: 0; border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 13px; }
.baby-name { color: var(--accent-text); }
.add-task { display: grid; grid-template-columns: 1fr 160px auto; gap: 8px; margin-top: 10px; }
.add-task input[type=text] { border-style: dashed; background: transparent; }
.add-task .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; }
.task-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
.link-btn { background: none; border: 0; padding: 6px 0; color: var(--muted); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.link-btn:hover { color: var(--accent-text); }
.link-btn.danger:hover { color: var(--warn); }
@media (max-width: 560px) { .add-task { grid-template-columns: 1fr 1fr; } .add-task input[type=text] { grid-column: 1 / -1; } }
.pick-name { text-align: left; max-width: 320px; width: 100%; justify-self: center; }
.pick-name input { font-size: 16px; text-align: center; border-radius: 999px; padding: 10px 14px; }
.baby-chip:hover { filter: brightness(.97); }
@media (prefers-reduced-motion: reduce) {
  .sky span, .choice .ico, .float-up, .spark, .modal, .modal-card { animation: none !important; }
  .float-up, .spark { display: none; }
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 20px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 22px; font-weight: 700; }
h3 { font-size: 17px; font-weight: 500; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 9px 18px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent-text); border: 1px solid var(--line); }
input[type=text], input[type=number], input[type=date], input[type=time], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 64px; }
label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; }
.brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 8px 0 0 var(--blush); margin-right: 8px; }
.save { font-size: 12px; color: var(--muted); }

/* Home */
.hero { display: grid; gap: 10px; margin-bottom: 28px; max-width: 640px; }
.hero p { font-size: 17px; color: var(--muted); }
.templates { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.tpl { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 8px; align-content: start; min-height: 170px; }
.tpl.open { border-color: var(--accent-text); box-shadow: 0 0 0 1px var(--accent); }
.tpl.open:hover { background: var(--accent-soft); }
.tpl.locked { opacity: .62; cursor: not-allowed; }
.tpl .tag { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; justify-self: start; }
.tpl.open .tag { background: var(--accent-soft); color: var(--accent-text); }
.tpl.locked .tag { background: var(--line); color: var(--muted); }
.tpl h3 { font-size: 20px; font-weight: 700; }
.how { margin-top: 36px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
.how div { display: grid; gap: 4px; }
.how b { font-family: var(--font-display); font-size: 16px; }

/* Planner */
.plan-head { display: grid; gap: 6px; margin-bottom: 18px; }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tpl-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tpl .tag { display: inline-flex; align-items: center; gap: 4px; }
.tpl.open .icon-bubble { animation: bob 3s ease-in-out infinite; }
.how .icon-bubble { margin-bottom: 4px; }
.brand-ico { width: 34px; height: 34px; border-radius: 12px; font-size: 18px; }
.next-ico { background: var(--surface); color: var(--blush-ink); flex: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; }
.stat .eyebrow { display: flex; align-items: center; gap: 6px; }
.stat .eyebrow .ic, .stat .eyebrow svg { color: var(--accent-text); }
.stat, .tpl, .task, .idea, .msg, .setup { box-shadow: 0 1px 0 var(--line), 0 6px 18px -12px color-mix(in srgb, var(--accent) 45%, transparent); }
.tpl.open, .stat, .idea { transition: transform .25s ease; }
.tpl.open:hover, .idea:hover { transform: translateY(-3px); }
.setup summary { display: flex; align-items: center; gap: 8px; }
.task-row input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border: 2px solid var(--accent); border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .2s; background: var(--surface); }
.task-row input[type=checkbox]:checked { background: var(--accent); transform: scale(1.08); }
.task-row input[type=checkbox]:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 2.5px 2.5px 0; transform: translate(0, -1px) rotate(45deg); }
.bar { height: 8px; }
.bar > i { transition: width .6s cubic-bezier(.3,1.3,.5,1); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.stat .big { font-family: var(--font-display); font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.over > i { background: var(--warn); }
.next { background: var(--blush); color: var(--blush-ink); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 20px; }
.next b { font-family: var(--font-display); font-size: 17px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent-text); }

.setup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-bottom: 20px; }
.setup summary { cursor: pointer; font-weight: 600; }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 14px; }

.phase { display: grid; grid-template-columns: 28px 1fr; gap: 0 14px; }
.rail { display: flex; flex-direction: column; align-items: center; }
.rail .n { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent-text); display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--bg); }
.rail .n.full { background: var(--accent); color: var(--accent-ink); }
.rail .line { flex: 1; width: 2px; background: var(--line); margin: 4px 0; }
.phase-body { padding-bottom: 26px; min-width: 0; }
.phase-title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; padding-top: 2px; }
.tasks { display: grid; gap: 8px; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.task-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; }
.task-row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent-text); margin: 0; }
.task.done .t-title { text-decoration: line-through; color: var(--muted); }
.t-title { font-weight: 500; min-width: 0; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--line); color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.late { background: var(--warn); color: var(--surface); }
.chip.soon { background: var(--blush); color: var(--blush-ink); }
.chip.ok { background: var(--accent-soft); color: var(--ok); }
.task details { border-top: 1px solid var(--line); padding: 0 12px; }
.task details summary { cursor: pointer; font-size: 13px; color: var(--accent-text); font-weight: 600; padding: 8px 0; }
.task details[open] { padding-bottom: 12px; }
.tip { font-size: 14px; background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; max-width: 70ch; }
.tip b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 2px; color: var(--accent-text); }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
td input[type=number] { max-width: 130px; text-align: right; margin-left: auto; display: block; }
.cat-tip { font-size: 13px; color: var(--muted); margin-top: 2px; max-width: 46ch; }
.neg { color: var(--warn); font-weight: 600; }
.pos { color: var(--ok); }

.guest-add { display: grid; grid-template-columns: 1fr 160px auto; gap: 8px; margin-bottom: 14px; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.empty { border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 16px; text-align: center; color: var(--muted); }
.guest { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.guest:last-child { border-bottom: 0; }
.guest select { width: auto; padding: 5px 8px; font-size: 13px; }
.x { background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: 6px; }
.x:hover { color: var(--warn); }

.sched { display: grid; gap: 0; }
.slot { display: grid; grid-template-columns: 72px 1fr; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.slot time { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
.slot .who { font-size: 13px; color: var(--accent-text); font-weight: 600; }
.slot.pre time { color: var(--muted); }

.ideas { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; }
.idea ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.idea li b { font-weight: 600; }
.section-intro { margin-bottom: 16px; max-width: 70ch; }
a.btn { text-decoration: none; display: inline-block; }
.kv { display: grid; grid-template-columns: minmax(110px, 40%) 1fr; gap: 10px; font-size: 14px; padding: 3px 0; }
.kv span:last-child { word-break: break-word; min-width: 0; }
.ficha-task { display: grid; gap: 2px; padding-top: 8px; border-top: 1px solid var(--line); }
.ficha-task h3 { font-size: 15px; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.itin-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.itin-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; padding: 10px; align-items: center; }
.itin-row .itin-desc { grid-column: 1 / -1; }
.itin-card { background: var(--surface); border: 1.5px solid var(--accent); border-radius: 16px; padding: 28px 22px; text-align: center; }
.itin-eyebrow { letter-spacing: .2em; text-transform: uppercase; font-size: 12px; color: var(--accent-text); font-weight: 600; }
.itin-title { font-size: 28px; margin: 6px 0; }
.itin-sub { color: var(--muted); margin-bottom: 18px; }
.itin-list { list-style: none; padding: 0; margin: 0 auto; text-align: left; max-width: 380px; }
.itin-list li { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.itin-list li:last-child { border-bottom: 0; }
.itin-list time { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--accent-text); font-variant-numeric: tabular-nums; }
.itin-list p { color: var(--muted); font-size: 14px; }
.itin-foot { margin-top: 18px; }
@media (max-width: 760px) { .itin-layout { grid-template-columns: 1fr; } }
.msgs { display: grid; gap: 12px; }

  // ---------- Estado ----------
  function isoPlus(days) {
    const d = new Date(); d.setDate(d.getDate() + days);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function freshState() {
    return {
      setup: { nombre: "", papa: "", bebe: "", bebeNombre: "", fecha: isoPlus(63), hora: "16:00", invitados: 30, presupuesto: 400000, lugar: "" },
      inv: { direccion: "", fin: "19:00", regalos: "", contacto: "", vestimenta: "" },
      done: {}, notes: {}, gastos: {}, guests: [], fields: {}, itin: null, itinMeta: { titulo: "", pie: "" }
    };
  }
  let state = freshState();
  let view = "home";
  let tab = "ruta";
  let saveMode = "local";
  let saveMsg = "";
  const LS_KEY = "yo-organizo-babyshower";
  try { const v = localStorage.getItem("yo-organizo-view"); if (v) { const o = JSON.parse(v); view = o.view || view; tab = o.tab || tab; } } catch (e) {}
  try { const s = localStorage.getItem(LS_KEY); if (s) state = Object.assign(freshState(), JSON.parse(s)); } catch (e) {}

  let docRef = null;
  let writing = Promise.resolve();
  let saveTimer = null;
  function persist() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
    if (!docRef) { setSave(saveMode === "local" ? "Guardado en este navegador" : ""); return; }
    clearTimeout(saveTimer);
    setSave("Guardando…");
    saveTimer = setTimeout(() => {
      const snapshot = JSON.parse(JSON.stringify(state));
      writing = writing.then(() => docRef.set(snapshot)).then(
        () => setSave("Guardado en tu cuenta"),
        () => { docRef = null; saveMode = "local"; setSave("Guardado en este navegador"); }
      );
    }, 700);
  }
  function setSave(msg) { saveMsg = msg; const el = document.getElementById("save"); if (el) el.textContent = msg; }
  function rememberView() { try { localStorage.setItem("yo-organizo-view", JSON.stringify({ view, tab })); } catch (e) {} }

  async function connect() {
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      const ref = db.doc("data/users/" + id + "/babyshower");
      const snap = await ref.get();
      docRef = ref; saveMode = "cloud";
      if (snap.exists) {
        state = Object.assign(freshState(), snap.data());
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
        setSave("Guardado en tu cuenta");
        render();
      } else {
        persist();
      }
    } catch (e) { docRef = null; }
  }

  // ---------- Utilidades ----------
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => "$" + Math.round(n || 0).toLocaleString("es-AR");
  function eventDate() {
    const p = (state.setup.fecha || "").split("-").map(Number);
    return p.length === 3 && p[0] ? new Date(p[0], p[1] - 1, p[2]) : null;
  }
  function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function due(task) { const e = eventDate(); if (!e) return null; const d = new Date(e); d.setDate(d.getDate() + task.off); return d; }
  const fmtDate = d => d ? d.toLocaleDateString("es-AR", { day: "numeric", month: "short" }).replace(".", "") : "";
  function daysTo(d) { return Math.round((d - today()) / 86400000); }
  function status(task) {
    if (state.done[task.id]) return { cls: "ok", label: "Hecho" };
    const d = due(task); if (!d) return { cls: "", label: "" };
    const n = daysTo(d);
    if (n < 0) return { cls: "late", label: "Atrasada · " + fmtDate(d) };
    if (n === 0) return { cls: "soon", label: "Hoy" };
    if (n <= 7) return { cls: "soon", label: "En " + n + (n === 1 ? " día" : " días") };
    return { cls: "", label: fmtDate(d) };
  }
  function timeAt(min) {
    const [h, m] = (state.setup.hora || "16:00").split(":").map(Number);
    const t = (h * 60 + m + min + 1440) % 1440;
    return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0");
  }

  function longDate(d) { return d ? d.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" }) : "[fecha]"; }

  // ---------- Datos por tarea ----------
  function fget(tid, f) {
    if (f.bind) { const [a, b] = f.bind.split("."); const v = (state[a] || {})[b]; return a === "gastos" && !v ? "" : v == null ? "" : v; }
    const v = ((state.fields || {})[tid] || {})[f.k]; return v == null ? "" : v;
  }
  function fset(tid, f, raw) {
    const val = f.t === "number" ? (raw === "" ? "" : Number(raw) || 0) : raw;
    if (f.bind) { const [a, b] = f.bind.split("."); state[a] = Object.assign({}, state[a], { [b]: a === "gastos" ? Number(val) || 0 : val }); return; }
    state.fields = state.fields || {};
    state.fields[tid] = Object.assign({}, state.fields[tid], { [f.k]: val });
  }
  function filledCount(tid) { return (FIELDS[tid] || []).filter(f => String(fget(tid, f)).trim() !== "").length; }

  function fichaView() {
    const s = state.setup, i = state.inv || {};

    const blocks = PHASES.map(p => {
      const ts = TASKS.filter(t => t.phase === p.id && FIELDS[t.id]);
      if (!ts.length) return "";
      return `<div class="idea"><span class="eyebrow">${p.name}</span>${ts.map(t => `
        <div class="ficha-task"><h3><b>${esc(t.title)}</b> ${state.done[t.id] ? '<span class="chip ok">Hecho</span>' : ""}</h3>
        ${FIELDS[t.id].map(f => row(f.l, f.t === "number" && f.bind && fget(t.id, f) ? money(fget(t.id, f)) : fget(t.id, f))).join("")}</div>`).join("")}</div>`;
    }).join("");
    const filled = Object.keys(FIELDS).reduce((a, k) => a + filledCount(k), 0);
    const total = Object.keys(FIELDS).reduce((a, k) => a + FIELDS[k].length, 0);
    return `
      <p class="section-intro muted">Todo lo que fuiste cargando en cada paso, en un solo lugar. Tenés ${filled} de ${total} datos completos. Para cargar o cambiar algo, abrí la tarea en la Ruta.</p>
      <div class="ideas">
        <div class="idea"><span class="eyebrow">El evento</span>
          ${row("Bebé", babyName() + (s.bebe ? (babyName() ? " · " : "") + BABY[s.bebe].label : ""))}${row("Mamá", s.nombre)}${row("Papá", s.papa || "")}${row("Fecha", eventDate() ? longDate(eventDate()) : "")}${row("Horario", s.hora + (i.fin ? " a " + i.fin : "") + " h")}
          ${row("Lugar", s.lugar)}${row("Dirección", i.direccion)}${row("Invitados previstos", s.invitados)}${row("Presupuesto", money(s.presupuesto))}
          ${row("Lista de regalos", i.regalos)}${row("Confirmar a", i.contacto)}
        </div>
        ${blocks}
      </div>`;
  }

  // ---------- Itinerario para invitados ----------
  const toMin = hhmm => { const [h, m] = (hhmm || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
  function itinItems() {
    if (state.itin) return state.itin;
    const juegos = ((state.fields || {}).t14 || {}).juegos;
    return ITIN_DEFAULT.map(([min, title, desc], n) => ({
      id: "i" + n, min, title,
      desc: desc || (title === "Juegos" ? (juegos ? juegos + "." : "Preparate para jugar y ganar premios.") : (state.setup.nombre || "La futura mamá") + " abre los regalos.")
    }));
  }
  function itinMeta() {
    const m = state.itinMeta || {};
    return { titulo: m.titulo || "Baby shower de " + (partyName() || "[nombre]"), pie: m.pie || "¡Gracias por acompañarnos en este momento tan especial!" };
  }
  function editItin(fn) { state.itin = itinItems().map(x => Object.assign({}, x)); fn(state.itin); state.itin.sort((a, b) => a.min - b.min); persist(); rerenderKeepScroll(); }

  function itinPreview() {

    return `

        <p class="itin-sub">${esc(longDate(eventDate()))}${s.lugar ? " · " + esc(s.lugar) : ""}${i.direccion ? "<br>" + esc(i.direccion) : ""}</p>

          <li><time>${timeAt(x.min)}</time><div><b>${esc(x.title)}</b>${x.desc ? `<p>${esc(x.desc)}</p>` : ""}</div></li>`).join("")}</ol>

  function printableHTML() {

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;600&display=swap">

<p class="f"><span class="dots">•••</span><br>${esc(m.pie)}</p></div></body></html>`;

  function itinView() {
    const m = state.itinMeta || {};
    const d = itinMeta();
    return `
      <p class="section-intro muted">Lo que ven los invitados: qué va a pasar y a qué hora. Se arma con tu hora de inicio y tus datos. Editá lo que quieras, descargalo y abrilo para imprimir (Ctrl+P o Compartir › Imprimir en el celular). También sirve para mandarlo por WhatsApp.</p>
      <div class="itin-layout">

    return `<div class="ideas">${IDEAS.map(b => `
      <div class="idea"><span class="icon-bubble">${ic(["palette","party-popper","cookie","lightbulb"][IDEAS.indexOf(b)] || "sparkles")}</span><h3><b>${b.title}</b></h3><ul>${b.items.map(([k, v]) => `<li><b>${k}:</b> <span class="muted">${v}</span></li>`).join("")}</ul></div>`).join("")}</div>`;
  }

  // ---------- Render y eventos ----------
  const app = document.getElementById("app");
  function render() {
    app.innerHTML = `
      <div class="topbar">
        <button class="brand" data-act="home"><span class="icon-bubble brand-ico">${ic("heart-handshake")}</span>Yo Organizo</button>
        ${view === "plan" ? `<span class="save" id="save">${esc(saveMsg)}</span>` : ""}
      </div>
      ${view === "plan" ? planView() : homeView()}
      ${picker ? pickerHTML() : ""}`;
    applyBaby();
    document.title = view === "plan" && partyName() ? "Baby shower de " + partyName() + " · Yo Organizo" : "Yo Organizo";
    drawIcons();
    openSet.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
  }
  // Mantiene abiertos los desplegables y el foco del campo al volver a dibujar
  const openSet = new Set(state.setup.nombre ? [] : ["setup"]);
  app.addEventListener("toggle", e => { const d = e.target; if (d.tagName === "DETAILS" && d.id) { if (d.open) openSet.add(d.id); else openSet.delete(d.id); } }, true);
  function rerenderKeepScroll() {
    setTimeout(() => {
      const y = window.scrollY;
      const focusId = document.activeElement && document.activeElement.id;
      render(); window.scrollTo(0, y);
      const f = focusId && document.getElementById(focusId); if (f) f.focus({ preventScroll: true });
    }, 0);
  }

  app.addEventListener("click", ev => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (act === "open") {
      if (!state.setup.bebe) { picker = true; render(); return; }
      view = "plan"; rememberView(); render(); window.scrollTo(0, 0);
    }
    else if (act === "hidetask") {
      state.hidden = Object.assign({}, state.hidden, { [id]: true }); delete state.done[id];
      persist(); rerenderKeepScroll(); toast("Tarea quitada. La podés recuperar al final de la fase.", "eye-off");
    }
    else if (act === "deltask") {
      state.custom = (state.custom || []).filter(c => c.id !== id); delete state.done[id]; delete state.notes[id];
      persist(); rerenderKeepScroll(); toast("Tarea eliminada", "trash-2");
    }
    else if (act === "restore") {
      const h = Object.assign({}, state.hidden);
      TASKS.filter(t => t.phase === id).forEach(t => { delete h[t.id]; });
      state.hidden = h; persist(); rerenderKeepScroll(); toast("Tareas recuperadas", "rotate-ccw");
    }
    else if (act === "changebaby") { picker = true; rerenderKeepScroll(); }
    else if (act === "closepicker") { picker = false; rerenderKeepScroll(); }
    else if (act === "pickbaby") {
      const b = BABY[id]; if (!b) return;
      const nameInput = document.getElementById("pick-name");

      state.setup.bebe = id; picker = false; persist();
      const wasPlan = view === "plan";
      view = "plan"; rememberView(); render();
      if (!wasPlan) window.scrollTo(0, 0);
      balloons(b.sw);
      toast(welcome(), b.icon);
    }
    else if (act === "home") { view = "home"; rememberView(); render(); }
    else if (act === "tab") { tab = id; rememberView(); rerenderKeepScroll(); }
    else if (act === "copy") {
      const pre = document.getElementById("m-" + id);
      const done = () => { el.textContent = "Copiado"; setTimeout(() => { el.textContent = "Copiar"; }, 1600); };
      const selectIt = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); el.textContent = "Seleccionado: copialo"; };
      try { navigator.clipboard.writeText(pre.textContent).then(done, selectIt); } catch (e) { selectIt(); }
    }
    else if (act === "delitin") { editItin(list => { const n = list.findIndex(y => y.id === id); if (n >= 0) list.splice(n, 1); }); }
    else if (act === "additin") { editItin(list => { const last = list.length ? list[list.length - 1].min : 0; list.push({ id: "i" + Date.now().toString(36), min: last + 30, title: "Nuevo momento", desc: "" }); }); }
    else if (act === "resetitin") { state.itin = null; persist(); rerenderKeepScroll(); }

      if (!window.claude || !window.claude.use) {
        // Fuera de claude.ai: descarga directa del navegador
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        a.download = "itinerario-baby-shower.html";
        document.body.appendChild(a); a.click(); a.remove();
        say("Listo. Abrí el archivo y usá Imprimir: entra en una hoja A4.");
        return;
      }
      window.claude.use("downloads").then(dl => {
        if (!dl) { say("La descarga no está disponible en esta vista. Abrí la app desde claude.ai para descargarlo."); return; }
        return dl.save({ filename: "itinerario-baby-shower.html", data: new Blob([html], { type: "text/html" }) })
          .then(() => say("Listo. Abrí el archivo y usá Imprimir: entra en una hoja A4."),
                e => say(e && e.code === "declined" ? "" : "No se pudo descargar. Probá de nuevo en un momento."));
      });
    }
    else if (act === "delguest") { state.guests = state.guests.filter(g => g.id !== id); persist(); rerenderKeepScroll(); }
  });
  app.addEventListener("change", ev => {
    const el = ev.target;
    if (el.dataset.act === "check") {
      state.done[el.dataset.id] = el.checked; if (!el.checked) delete state.done[el.dataset.id];
      if (el.checked) {
        const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2);
        const t = allTasks().find(x => x.id === el.dataset.id);
        const ph = t && PHASES.find(p => p.id === t.phase);
        if (ph && allTasks().filter(x => x.phase === ph.id).every(x => state.done[x.id])) setTimeout(() => toast("¡Fase completa: " + ph.name + "!", "party-popper"), 350);
      }
    }
    else if (el.dataset.setup) { const k = el.dataset.setup; state.setup[k] = el.type === "number" ? Number(el.value) || 0 : el.value; }
    else if (el.dataset.gasto) { state.gastos[el.dataset.gasto] = Number(el.value) || 0; }
    else if (el.dataset.rsvp) { const g = state.guests.find(x => x.id === el.dataset.rsvp); if (g) g.rsvp = el.value; }
    else if (el.dataset.sent) { const g = state.guests.find(x => x.id === el.dataset.sent); if (g) g.sent = el.checked; }
    else if (el.dataset.canal) { const g = state.guests.find(x => x.id === el.dataset.canal); if (g) g.canal = el.value; }
    else if (el.dataset.inv) { state.inv = Object.assign({}, state.inv, { [el.dataset.inv]: el.value }); }
    else if (el.dataset.cdate) { const c = (state.custom || []).find(x => x.id === el.dataset.cdate); if (c) c.off = offFromIso(el.value, c.off); }
    else if (el.dataset.field) { const [tid, k] = el.dataset.field.split("|"); const f = (FIELDS[tid] || []).find(x => x.k === k); if (f) fset(tid, f, el.value); }
    else if (el.dataset.itinmeta) { state.itinMeta = Object.assign({}, state.itinMeta, { [el.dataset.itinmeta]: el.value.trim() }); }
    else if (el.dataset.itin) {
      const [id, k] = el.dataset.itin.split("|");
      editItin(list => { const x = list.find(y => y.id === id); if (!x) return; if (k === "hora") x.min = toMin(el.value) - toMin(state.setup.hora); else x[k] = el.value; });
      return;
    }
    else if (el.dataset.note) { state.notes[el.dataset.note] = el.value; persist(); return; }
    else return;
    persist(); rerenderKeepScroll();
  });
  app.addEventListener("submit", ev => {
    if (ev.target.classList.contains("add-task")) {
      ev.preventDefault();
      const ph = ev.target.dataset.phase;
      const title = document.getElementById("add-" + ph).value.trim();
      if (!title) return;
      const off = offFromIso(document.getElementById("add-d-" + ph).value, PHASE_OFF[ph]);
      state.custom = (state.custom || []).concat([{ id: "c" + Date.now().toString(36), phase: ph, off, title }]);
      persist(); rerenderKeepScroll(); toast("Tarea agregada", "plus");
      setTimeout(() => { const inp = document.getElementById("add-" + ph); if (inp) inp.focus(); }, 30);
      return;
    }
    if (ev.target.id !== "guest-form") return;
    ev.preventDefault();
    const name = document.getElementById("guest-name").value.trim();
    if (!name) return;
    state.guests.push({ id: "g" + Date.now().toString(36), name, group: document.getElementById("guest-group").value, rsvp: "pend" });
    persist(); rerenderKeepScroll();
    const inp = document.getElementById("guest-name"); if (inp) inp.focus();
  });

  if (saveMode === "local") saveMsg = "";
  document.getElementById("sky-slot").innerHTML = skyHTML();
  window.addEventListener("keydown", e => { if (e.key === "Escape" && picker && state.setup.bebe) { picker = false; rerenderKeepScroll(); } });
  render();
  connect();
})();
</script>
</body>
</html>
